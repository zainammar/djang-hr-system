{% extends 'employees/base.html' %}
{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}

{% block content %}
<div style="display:flex; justify-content:center; padding:3rem 1rem;">
  <div class="delete-card">
    <div class="delete-icon">🗑️</div>
    <h2 class="text-navy" style="margin-bottom:0.75rem;">Delete Confirmation</h2>
    <p class="text-muted" style="margin-bottom:1.5rem;">
      Are you sure you want to delete <strong>{{ obj }}</strong>? 
      This action cannot be undone.
    </p>
    <form method="post" style="display:flex; gap:0.75rem; justify-content:center;">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url back_url %}" class="btn btn-outline">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
